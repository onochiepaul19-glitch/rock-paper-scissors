name: audit-chunks
on:
  push:
    branches: [audit-chunks]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream tree
        uses: actions/checkout@v4
        with:
          repository: revert-finance/v4lend
          ref: f6d0fb41b7487f60ce64e011312a956e184e2a75
          path: v4lend-src
      - name: Hex-split and stage
        run: |
          set -e
          rm -rf hex
          mkdir -p hex
          cd v4lend-src
          find src docs -type f | sort > ../allfiles.txt
          while IFS= read -r f; do
            flat=$(echo "$f" | tr '/' '_')
            rm -rf /tmp/parts && mkdir -p /tmp/parts
            split -b 15000 -d -a 2 "$f" "/tmp/parts/p"
            i=0
            for p in /tmp/parts/p*; do
              od -An -v -tx1 "$p" | tr -d ' \n' > "../hex/${flat}.$(printf %02d $i).hex"
              i=$((i+1))
            done
            md5sum "$f" >> ../hex/orig-md5.txt
          done < ../allfiles.txt
          sort ../hex/orig-md5.txt -o ../hex/orig-md5.txt
      - name: Commit and push
        run: |
          set -e
          git config user.name "audit-bot"
          git config user.email "actions@github.com"
          git add hex
          git commit -m "add hex chunks [skip ci]"
          git push
